<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/icons/fotogram_icon.png"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <img src="./assets/icons/Capa_1.png" alt="Fotogram icon" />
      </div>
    </header>

    <main>
      <article class="gallery">
        <h1>Your personal photo album</h1>
        <section class="gallery_pictures">
          <img src="./assets/img/alaska.png" alt="Alaska" />
          <img src="./assets/img/anime.png" alt="Anime" />
          <img src="./assets/img/atmosphere.png" alt="Atmosphere" />
          <img src="./assets/img/blue_tit.png" alt="Blue Tit" />
          <img src="./assets/img/hurricane.png" alt="Hurricane" />
          <img src="./assets/img/lake.png" alt="Lake" />
          <img src="./assets/img/moorente.png" alt="Moor Duck" />
          <img src="./assets/img/sea.png" alt="Sea" />
          <img src="./assets/img/snow_bunting.png" alt="Snow Bunting" />
          <img src="./assets/img/snow_leopard.png" alt="Snoe Leopard" />
          <img src="./assets/img/travel.png" alt="Mountains" />
          <img src="./assets/img/winter.png" alt="Tree in Winter" />
        </section>
      </article>
    </main>

    <footer>
      <div>
        <img src="./assets/icons/da_logo.png" alt="Developer Akademie Logo" />
      </div>
      <div>
        <img src="./assets/icons/© 2023 Developer Akademie GmbH.png" alt="" />
      </div>
    </footer>
  </body>
  <script src="./script.js"></script>
</html>
