<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/icons/fotogram_icon.png"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page_header">
      <div>
        <img src="./assets/icons/Capa_1.png" alt="Fotogram icon" />
      </div>
    </header>

    <main>
      <article class="gallery">
        <h1>Your personal photo album</h1>
        <section class="gallery_pictures">
          <button onclick="openDialog()"><img src="./assets/img/alaska.png" alt="Alaska"/></button>
          <button onclick="openDialog()"><img src="./assets/img/anime.png" alt="Anime"/></button>
          <button onclick="openDialog()"><img src="./assets/img/atmosphere.png" alt="Atmosphere"/></button>
          <button onclick="openDialog()"><img src="./assets/img/blue_tit.png" alt="Blue Tit"/></button>
          <button onclick="openDialog()"><img src="./assets/img/hurricane.png" alt="Hurricane"/></button>
          <button onclick="openDialog()"><img src="./assets/img/lake.png" alt="Lake"/></button>
          <button onclick="openDialog()"><img src="./assets/img/moorente.png" alt="Moor Duck"/></button>
          <button onclick="openDialog()"><img src="./assets/img/sea.png" alt="Sea"/></button>
          <button onclick="openDialog()"><img src="./assets/img/snow_bunting.png" alt="Snow Bunting"/></button>
          <button onclick="openDialog()"><img src="./assets/img/snow_leopard.png" alt="Snoe Leopard"/></button>
          <button onclick="openDialog()"><img src="./assets/img/travel.png" alt="Mountains"/></button>
          <button onclick="openDialog()"><img src="./assets/img/winter.png" alt="Tree in Winter"/></button>
        </section>
      </article>

      <dialog id="photoDialog" class="dialog">
        <header class="dialog_header">
          <h2>Platzhalter Name</h2>
          <button onclick="closeDialog()">
            <img src='./assets/icons/Close icon.svg alt="close icon"' />
          </button>
        </header>

        <section>
          <img src="" alt="" />
        </section>

        <footer class="dialog_footer">
          <nav>
            <button>
              <img
                src="./assets/icons/button_left.png"
                alt="arrow to the left"
              />
            </button>
            <p>1/12</p>
            <button>
              <img
                src="./assets/icons/button_right.png"
                alt="arrow to the right"
              />
            </button>
          </nav>
        </footer>
      </dialog>
    </main>

    <footer class="page_footer">
      <div>
        <img src="./assets/icons/da_logo.png" alt="Developer Akademie Logo" />
      </div>
      <div>
        <img src="./assets/icons/© 2023 Developer Akademie GmbH.png" alt="" />
      </div>
    </footer>
  </body>
  <script src="./script.js"></script>
</html>
