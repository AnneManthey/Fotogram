<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fotogram</title>
  <link rel="icon" type="image/x-icon" href="./assets/icons/fotogram_icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body onload="renderGallery()">
  <header class="page_header">
    <img src="./assets/icons/Capa_1.png" alt="Fotogram Logo" />
  </header>

  <main>
    <article class="gallery">
      <h1>Your personal photo album</h1>
      <section id="galleryPictures" class="gallery_pictures">
      </section>
    </article>
    <dialog id="photoDialog" class="photo_dialog">
    </dialog>
  </main>

  <footer class="page_footer">
    <img src="./assets/icons/da_logo.png" alt="Developer Akademie Logo" />
    <img src="./assets/icons/© 2023 Developer Akademie GmbH.png" alt="copyright Developer Akademie GmbH" />
  </footer>
</body>
<script src="./script.js"></script>

</html>
